name: Deploy YummyAnime plugin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          find . -name '*.js' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Run contract tests
        shell: bash
        run: |
          set -e
          for test in tests/*.test.js; do
            echo "-- $test"
            node "$test"
          done

      - name: Rebuild bundled plugin
        run: node build.js

      - name: Check bundled plugin syntax
        run: node --check dist/index.js

      - name: Check production bundle syntax
        run: node --check stable/index.js

      - name: Verify dist/index.js matches sources
        shell: bash
        run: |
          set -e
          if ! git diff --exit-code -- dist/index.js; then
            echo "::error::dist/index.js is out of date. Run node build.js and commit the result."
            exit 1
          fi

      - name: Update YummyStatus snapshot
        id: yummy_status
        continue-on-error: true
        run: node scripts/update-status.js

      - name: Report YummyStatus result
        if: steps.yummy_status.outcome == 'failure'
        run: echo "::warning::YummyStatus snapshot update failed; continuing Pages deploy with the existing status files."

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages site
        shell: bash
        run: |
          mkdir -p _pages
          cp -R dist assets status _pages/
          cp index.js style.css README.md _pages/
          if [ -d stable ]; then cp -R stable _pages/stable; fi
          if [ -f stable.json ]; then cp stable.json _pages/; fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _pages

      - name: Deploy
        id: deployment
        run: node scripts/deploy-pages.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
          PAGES_DEPLOY_TIMEOUT_MS: '3600000'
